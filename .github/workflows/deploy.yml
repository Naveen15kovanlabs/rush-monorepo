
name: Build & Deploy Monorepo (Selective)

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_all:
        description: "Force build all Docker images"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
      HRMS_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_HRMS_API_URL: "http://localhost:8000"
      RESEND_API_KEY: "re_build_dummy_key"
      BETTER_AUTH_SECRET: "better_auth_secret_32_characters_minimum_len_12345"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Step 1: Checkout repository with all Git submodules
      - name: Checkout Monorepo with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Step 3: Install dependencies using Rush
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      # Step 4: Build Rush projects
      - name: Rush Build
        run: node common/scripts/install-run-rush.js build

      # Step 5: Authenticate with GitHub Container Registry
      # Uses the automatically generated GitHub Actions token
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Pull requests build images without publishing
      - name: Build Docker Images (Pull Request)
        if: github.event_name == 'pull_request'
        run: node common/scripts/build-images.js --changed-only --single
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      # Step 7: Manual full build and publish
      - name: Build and Push All Images
        if: github.event_name == 'workflow_dispatch' && inputs.build_all
        run: node common/scripts/build-images.js --push --single
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      # Step 8: Selective build and publish
      - name: Build and Push Changed Images
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.build_all)
        run: node common/scripts/build-images.js --changed-only --push --single
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      # Step 9: Optional Kubernetes deployment
      # Uncomment and configure when your Kubernetes cluster is ready.
